workflows:
  android-debug:
    name: HybridFL Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/HybridFLApp/local.properties"
      - name: Find gradlew
        script: |
          find $CM_BUILD_DIR -name "gradlew" -type f
      - name: Build Debug APK
        script: |
          GRADLEW=$(find $CM_BUILD_DIR -name "gradlew" -type f | head -1)
          chmod +x "$GRADLEW"
          cd $(dirname "$GRADLEW")
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - aimanmudenur2@gmail.com