workflows:
  android-debug:
    name: HybridFL Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/HybridFLApp/local.properties"
      - name: Build Debug APK
        script: |
          cd $CM_BUILD_DIR/HybridFLApp
          sed -i 's/\r//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
    publishing:
      email:
        recipients:
          - aimanmudenur2@gmail.com